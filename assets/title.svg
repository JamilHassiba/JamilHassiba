<svg xmlns="http://www.w3.org/2000/svg" width="400" height="84" viewBox="0 0 400 84" role="img" aria-label="Hello there! I'm Jamil, a coding enthusiast :)">
  <style>
    text {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 24px;
      font-weight: 600;
      fill: #2F435A;
    }
    @media (prefers-color-scheme: dark) {
      text { fill: #7E96B0; }
    }
    #r1, #r2 { width: 0; }
    #r1 { animation: w1 0.60s steps(12) 0.30s forwards; }
    #r2 { animation: w2 1.65s steps(33) 1.10s forwards; }
    @keyframes w1 { to { width: 150px; } }
    @keyframes w2 { to { width: 395px; } }
  </style>

  <defs>
    <clipPath id="c1"><rect id="r1" x="0" y="0" height="84" /></clipPath>
    <clipPath id="c2"><rect id="r2" x="0" y="0" height="84" /></clipPath>
  </defs>

  <g clip-path="url(#c1)"><text x="0" y="26">Hello there!</text></g>
  <g clip-path="url(#c2)"><text x="0" y="56">I'm Jamil, a coding enthusiast :)</text></g>
</svg>
