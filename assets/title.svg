<svg xmlns="http://www.w3.org/2000/svg" width="300" height="106" viewBox="0 0 300 106" role="img" aria-label="Hello. I'm Jamil, a coding enthusiast">
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 600;
      fill: #1f2328;
    }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
    }
    #r1, #r2 { width: 0; }
    #r1 { animation: w1 0.25s steps(5)  0.30s forwards; }
    #r2 { animation: w2 1.45s steps(29) 0.75s forwards; }
    @keyframes w1 { to { width: 56px; } }
    @keyframes w2 { to { width: 280px; } }
  </style>

  <defs>
    <clipPath id="c1"><rect id="r1" x="0" y="0" height="106" /></clipPath>
    <clipPath id="c2"><rect id="r2" x="0" y="0" height="106" /></clipPath>
  </defs>

  <g clip-path="url(#c1)"><text x="0" y="40">Hello</text></g>
  <g clip-path="url(#c2)"><text x="0" y="78">I'm Jamil, a coding enthusiast</text></g>
</svg>
